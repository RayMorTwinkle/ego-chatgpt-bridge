[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ego-chatgpt-bridge"
version = "0.5.1"
description = "Durable local/LAN Agent bridge using the installed Ego Browser"
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2", "pydantic>=2,<3", "uvicorn>=0.35,<1", "httpx>=0.28,<1", "python-dotenv>=1,<2", "cryptography>=46,<49"]

[project.scripts]
ego-bridge = "ego_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ego_bridge"]

[tool.hatch.build.targets.wheel.force-include]
"src/ego_bridge/browser.mjs" = "ego_bridge/browser.mjs"
"src/ego_bridge/page-state.mjs" = "ego_bridge/page-state.mjs"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
